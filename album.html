<body class="trophyroom">
  <!-- the shared bar (§3.3); the room's own symbol is the heading below it -->
  <header class="topbar" id="topbar"></header>
  <!-- The room says its own name in the one language a five-year-old reads: its
       symbol, the same one that marks it on the map (§3.2). The heading it used
       to be, and the paragraph explaining where trophies come from, were text
       under a bar that already counts the trophies — nobody read either. The
       name survives for screen readers, on the heading itself. -->
  <div class="roomhead">
    <h1 class="roomsymbol" aria-label="Pokalraum" data-i18n-label="region_pokalraum">
      <span data-icon="region-pokalraum" data-icon-size="56" aria-hidden="true">🏆</span>
    </h1>
  </div>
  <main id="album"></main>
  <!-- Mara could not get out of this room: the way back was a small button at
       the very top, and she had scrolled past it. A second big button sat at the
       foot of the shelves for a while; the sticky bar (see .trophyroom .topbar)
       already carries the map button down with her, so the button was a second
       door standing beside the first one. -->
  <footer class="roomfoot footlinks">
    <a class="footlink" href="privacy.html" data-i18n="privacyLink">Datenschutz</a>
    <a class="footlink" href="about.html" data-i18n="aboutLink">Über mich</a>
  </footer>
  <script type="module" src="assets/js/album.js?v=42"></script>
</body>
