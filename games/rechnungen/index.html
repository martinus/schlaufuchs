      "../../assets/js/about.js": "../../assets/js/about.js?v=75",
      "../../assets/js/adaptive.js": "../../assets/js/adaptive.js?v=75",
      "../../assets/js/album.js": "../../assets/js/album.js?v=75",
      "../../assets/js/audio.js": "../../assets/js/audio.js?v=75",

      "../../assets/js/fox.js": "../../assets/js/fox.js?v=75",
      "../../assets/js/graphics.js": "../../assets/js/graphics.js?v=75",
      "../../assets/js/i18n.js": "../../assets/js/i18n.js?v=75",
      "../../assets/js/journey.js": "../../assets/js/journey.js?v=75",
      "../../assets/js/leaveguard.js": "../../assets/js/leaveguard.js?v=75",
      "../../assets/js/levelfox.js": "../../assets/js/levelfox.js?v=75",
      "../../assets/js/map.js": "../../assets/js/map.js?v=75",
      "../../assets/js/mapwalk.js": "../../assets/js/mapwalk.js?v=75",
      "../../assets/js/motion.js": "../../assets/js/motion.js?v=75",
      "../../assets/js/overlay.js": "../../assets/js/overlay.js?v=75",
      "../../assets/js/parents.js": "../../assets/js/parents.js?v=75",
      "../../assets/js/parentstats.js": "../../assets/js/parentstats.js?v=75",
      "../../assets/js/privacy.js": "../../assets/js/privacy.js?v=75",
      "../../assets/js/rewards.js": "../../assets/js/rewards.js?v=75",
      "../../assets/js/roundstore.js": "../../assets/js/roundstore.js?v=75",
      "../../assets/js/showcase.js": "../../assets/js/showcase.js?v=75",
      "../../assets/js/storage.js": "../../assets/js/storage.js?v=75",
      "../../assets/js/stub.js": "../../assets/js/stub.js?v=75",
      "../../assets/js/trophycard.js": "../../assets/js/trophycard.js?v=75",
      "../../assets/i18n/de.js": "../../assets/i18n/de.js?v=75",

      "./logic.js": "./logic.js?v=75",

      "./picker.js": "./picker.js?v=75",

    }

</head>
<body>
  <div class="game">
    <header class="topbar" id="topbar"></header>

    <!-- the path and the question are one group: "here is how far you are,
         here is what is next". The answers sit under the thumb. -->
    <div class="stage">
      <!-- The operation and difficulty read as the round's title, so they sit
           above the scene and share its width instead of crowding the top bar. -->
      <button class="chip pickheading" id="pickchip"></button>
      <!-- one picture, no words: sky = stars still to win, basket = stars you
           own, path = the fox climbing the mountain. See §10.5, §12. -->
      <div class="journey-wrap" id="journey" role="img"></div>
      <div class="question" id="question"></div>
      <div class="feedback-aid" id="feedback" hidden></div>
    </div>

    <div class="answers" id="answers"></div>
  </div>

  <!-- Level picker (§3.3, §12.1: overlay, never a separate page). One scrollable
       list of every tile there is: six mode chips (＋ − ×÷ 🧱 ⊞ 🎲) per
       difficulty, each showing the stars it still has to give. -->
  <div class="overlay" id="pick-overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <h2 data-i18n="rechnenPickTitle">Rechenart &amp; Schwierigkeit</h2>
      <div class="levels" id="pick-levels"></div>
    </div>
  </div>

  <!-- round summary (§10.1): stars say how it went, the trophy is the prize,
       ONE button says what happens next. NOT aria-modal: the top bar and the
       chip above it stay tappable, on purpose (§3.4). -->
  <div class="overlay" id="sum-overlay" hidden>
    <div class="sheet summary" role="dialog" aria-modal="false">
      <div class="bigstars" id="sum-stars"></div>
      <p class="sline stat" id="sum-score"></p>
      <p class="sline goal" id="sum-goal" hidden></p>
      <p class="sline best" id="sum-best" hidden></p>
      <!-- the tempo ladder (§10.6): a symbol, never seconds -->
      <p class="sline tempo" id="sum-tempo" hidden></p>
      <div class="trophy-earn" id="sum-trophy" hidden></div>
      <button class="primary" id="sum-ok"></button>
    </div>
  </div>

  <script type="module" src="rechnungen.js?v=75"></script>
</body>
</html>
