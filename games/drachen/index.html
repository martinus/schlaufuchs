<body>
  <div class="game">
    <header class="topbar" id="topbar"></header>

    <!-- the path and the scene are one group: "here is how far you are, here is
         what is happening". The choices sit under the thumb. -->
    <div class="stage">
      <!-- The story and its difficulty read as the round's title, so they sit
           above the scene and share its width instead of crowding the top bar. -->
      <button class="chip pickheading" id="pickchip"></button>
      <!-- one picture, no words: sky = endings still to find, basket = the ones
           you own, path = the fox walking deeper into the story. See §10.5. -->
      <div class="journey-wrap" id="journey" role="img"></div>
      <!-- The story card. It reuses lesen's reading card (`.read`) on purpose:
           book typography, the scene emoji as an illustrated capital, and the
           rule that shrinks the path scene so a long scene, its choices and the
           fox all fit one phone screen without scrolling. `#endname` is the
           ending's own name — the collectible, said out loud, and the reason the
           summary waits for a tap instead of covering it. -->
      <div class="wordcard read story" id="wordcard">
        <span class="scene" id="scene" aria-hidden="true"></span>
        <div class="question" id="question"></div>
        <p class="endname" id="endname" hidden></p>
      </div>
    </div>

    <div class="answers" id="answers"></div>
  </div>

  <!-- Level picker (§3.3: overlay, never a separate page). Every story there is,
       three per difficulty, each showing the endings it still has to give. -->
  <div class="overlay" id="pick-overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <h2 data-i18n="drachenPickTitle">Geschichte &amp; Schwierigkeit</h2>
      <div class="levels" id="pick-levels"></div>
    </div>
  </div>

  <!-- round summary (§10.1): stars say how it went, the ending strip says WHICH
       endings she has and how many are still hidden, the trophy is the prize,
       ONE button says what happens next. There is no "Neuer Rekord!" line and no
       tempo line here (§21) — the shared summary skips both when they are
       absent. NOT aria-modal: the top bar and the chip stay tappable (§3.4). -->
  <div class="overlay" id="sum-overlay" hidden>
    <div class="sheet summary" role="dialog" aria-modal="false">
      <div class="bigstars" id="sum-stars"></div>
      <div class="endings" id="sum-endings"></div>
      <div class="trophy-earn" id="sum-trophy" hidden></div>
      <button class="primary" id="sum-ok"></button>
    </div>
  </div>

  <script type="module" src="drachen.js?v=dev"></script>
</body>
