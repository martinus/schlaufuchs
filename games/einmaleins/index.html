<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Einmaleins — Schlaufuchs</title>
  <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/schlaufuchs.css?v=32">
  <!-- cache coherence: see tools/version-assets.js -->
  <script type="importmap">
  {
    "imports": {
      "../../assets/js/about.js": "../../assets/js/about.js?v=32",
      "../../assets/js/adaptive.js": "../../assets/js/adaptive.js?v=32",
      "../../assets/js/album.js": "../../assets/js/album.js?v=32",
      "../../assets/js/audio.js": "../../assets/js/audio.js?v=32",
      "../../assets/js/chrome.js": "../../assets/js/chrome.js?v=32",
      "../../assets/js/confetti.js": "../../assets/js/confetti.js?v=32",
      "../../assets/js/fox.js": "../../assets/js/fox.js?v=32",
      "../../assets/js/graphics.js": "../../assets/js/graphics.js?v=32",
      "../../assets/js/i18n.js": "../../assets/js/i18n.js?v=32",
      "../../assets/js/journey.js": "../../assets/js/journey.js?v=32",
      "../../assets/js/map.js": "../../assets/js/map.js?v=32",
      "../../assets/js/overlay.js": "../../assets/js/overlay.js?v=32",
      "../../assets/js/parents.js": "../../assets/js/parents.js?v=32",
      "../../assets/js/parentstats.js": "../../assets/js/parentstats.js?v=32",
      "../../assets/js/privacy.js": "../../assets/js/privacy.js?v=32",
      "../../assets/js/rewards.js": "../../assets/js/rewards.js?v=32",
      "../../assets/js/storage.js": "../../assets/js/storage.js?v=32",
      "../../assets/js/stub.js": "../../assets/js/stub.js?v=32",
      "../../assets/js/trophycard.js": "../../assets/js/trophycard.js?v=32",
      "../../assets/i18n/de.js": "../../assets/i18n/de.js?v=32",
      "../../assets/i18n/en.js": "../../assets/i18n/en.js?v=32",
      "./logic.js": "./logic.js?v=32",
      "./einmaleins.js": "./einmaleins.js?v=32",
      "./i18n.js": "./i18n.js?v=32"
    }
  }
  </script>
</head>
<body>
  <div class="game">
    <header class="topbar" id="topbar"></header>

    <!-- the path and the question are one group: "here is how far you are,
         here is what is next". The answers sit under the thumb. -->
    <div class="stage">
      <!-- The table and difficulty read as the round's title, so they sit above
           the scene and share its width instead of crowding the top bar. -->
      <button class="chip pickheading" id="pickchip"></button>
      <!-- one picture, no words: sky = stars still to win, basket = stars you
           own, path = the fox. See §10.5. -->
      <div class="journey-wrap" id="journey" role="img"></div>
      <div class="question" id="question"></div>
      <div class="feedback-aid" id="feedback" hidden></div>
    </div>

    <div class="answers" id="answers"></div>
  </div>

  <!-- table & difficulty picker (§3.3: overlay, never a separate page) -->
  <div class="overlay" id="pick-overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <h2 data-i18n="emPickTitle">Reihe &amp; Schwierigkeit</h2>
      <div class="seg" id="pick-diff"></div>
      <div class="tilegrid" id="pick-tables"></div>
    </div>
  </div>

  <!-- round summary (§10.1) -->
  <div class="overlay" id="sum-overlay" hidden>
    <!-- A child who just won reads almost nothing. Stars say how it went, the
         trophy is the prize, ONE button says what happens next. Mara read the
         three buttons that used to be here as a wall and tried to press the
         chip behind the sheet; the map and the level picker live in the top bar
         and the chip, which is where she looked for them anyway (§10.1). -->
    <div class="sheet summary" role="dialog" aria-modal="true">
      <div class="bigstars" id="sum-stars"></div>
      <p class="sline stat" id="sum-score"></p>
      <p class="sline goal" id="sum-goal" hidden></p>
      <p class="sline best" id="sum-best" hidden></p>
      <div class="trophy-earn" id="sum-trophy" hidden></div>
      <button class="primary" id="sum-ok"></button>
    </div>
  </div>

  <script type="module" src="einmaleins.js?v=32"></script>
</body>
</html>
