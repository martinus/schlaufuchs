<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Einmaleins — Schlaufuchs</title>
  <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/schlaufuchs.css?v=27">
  <!-- cache coherence: see tools/version-assets.js -->
  <script type="importmap">
  {
    "imports": {
      "../../assets/js/about.js": "../../assets/js/about.js?v=27",
      "../../assets/js/adaptive.js": "../../assets/js/adaptive.js?v=27",
      "../../assets/js/album.js": "../../assets/js/album.js?v=27",
      "../../assets/js/audio.js": "../../assets/js/audio.js?v=27",
      "../../assets/js/chrome.js": "../../assets/js/chrome.js?v=27",
      "../../assets/js/confetti.js": "../../assets/js/confetti.js?v=27",
      "../../assets/js/fox.js": "../../assets/js/fox.js?v=27",
      "../../assets/js/graphics.js": "../../assets/js/graphics.js?v=27",
      "../../assets/js/i18n.js": "../../assets/js/i18n.js?v=27",
      "../../assets/js/journey.js": "../../assets/js/journey.js?v=27",
      "../../assets/js/map.js": "../../assets/js/map.js?v=27",
      "../../assets/js/parents.js": "../../assets/js/parents.js?v=27",
      "../../assets/js/parentstats.js": "../../assets/js/parentstats.js?v=27",
      "../../assets/js/privacy.js": "../../assets/js/privacy.js?v=27",
      "../../assets/js/rewards.js": "../../assets/js/rewards.js?v=27",
      "../../assets/js/storage.js": "../../assets/js/storage.js?v=27",
      "../../assets/i18n/de.js": "../../assets/i18n/de.js?v=27",
      "../../assets/i18n/en.js": "../../assets/i18n/en.js?v=27",
      "./logic.js": "./logic.js?v=27",
      "./einmaleins.js": "./einmaleins.js?v=27",
      "./i18n.js": "./i18n.js?v=27"
    }
  }
  </script>
</head>
<body>
  <div class="game">
    <header class="topbar">
      <a class="iconbtn" href="../../" data-i18n-label="back" data-icon="ui-map" data-icon-size="22">🗺️</a>
      <div class="foxchip" id="foxchip"></div>
      <button class="iconbtn" id="gearbtn" data-i18n-label="settings" data-icon="ui-gear" data-icon-size="22">⚙️</button>
    </header>

    <!-- the path and the question are one group: "here is how far you are,
         here is what is next". The answers sit under the thumb. -->
    <div class="stage">
      <!-- The table and difficulty read as the round's title, so they sit above
           the scene and share its width instead of crowding the top bar. -->
      <button class="chip pickheading" id="pickchip"></button>
      <!-- one picture, no words: sky = stars still to win, basket = stars you
           own, path = the fox. See §10.5. -->
      <div class="journey-wrap" id="journey" role="img"></div>
      <div class="question" id="question"></div>
      <div class="feedback-aid" id="feedback" hidden></div>
    </div>

    <div class="answers" id="answers"></div>
  </div>

  <!-- table & difficulty picker (§3.3: overlay, never a separate page) -->
  <div class="overlay" id="pick-overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <h2 data-i18n="emPickTitle">Reihe &amp; Schwierigkeit</h2>
      <div class="seg" id="pick-diff"></div>
      <div class="tilegrid" id="pick-tables"></div>
    </div>
  </div>

  <!-- round summary (§10.1) -->
  <div class="overlay" id="sum-overlay" hidden>
    <!-- A child who just won reads almost nothing. Stars say how it went, the
         trophy is the prize, one button says what happens next. Score and
         time are one quiet line of numbers, not three sentences (§10.1). -->
    <div class="sheet summary" role="dialog" aria-modal="true">
      <div class="bigstars" id="sum-stars"></div>
      <p class="sline stat" id="sum-score"></p>
      <p class="sline goal" id="sum-goal" hidden></p>
      <p class="sline best" id="sum-best" hidden></p>
      <div class="trophy-earn" id="sum-trophy" hidden></div>
      <button class="primary" id="sum-again"></button>
      <div class="seg sum-secondary">
        <a class="sum-link" href="../../">🗺️ <span data-i18n="back">Zur Karte</span></a>
        <button id="sum-pick" data-i18n="emPickTitle">Reihe &amp; Schwierigkeit</button>
      </div>
    </div>
  </div>

  <script type="module" src="einmaleins.js?v=27"></script>
</body>
</html>
