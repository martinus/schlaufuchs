<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Einmaleins — Schlaufuchs</title>
  <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/schlaufuchs.css?v=64">
  <!-- cache coherence: see tools/version-assets.js -->
  <script>
  // Built here from one version and a plain list, not written out as a
  // versioned URL per line, so a deploy bumps a single number. Injected
  // before the module entry below — an import map must exist before the
  // first module loads. A nested import (map.js -> ./storage.js) resolves
  // against these keys, so it is versioned too. See tools/version-assets.js.
  (function () {
    var v = "64";
    var mods = [
      "../../assets/js/about.js",
      "../../assets/js/adaptive.js",
      "../../assets/js/album.js",
      "../../assets/js/audio.js",
      "../../assets/js/chrome.js",
      "../../assets/js/confetti.js",
      "../../assets/js/fox.js",
      "../../assets/js/graphics.js",
      "../../assets/js/i18n.js",
      "../../assets/js/journey.js",
      "../../assets/js/leaveguard.js",
      "../../assets/js/levelfox.js",
      "../../assets/js/map.js",
      "../../assets/js/mapwalk.js",
      "../../assets/js/motion.js",
      "../../assets/js/overlay.js",
      "../../assets/js/parents.js",
      "../../assets/js/parentstats.js",
      "../../assets/js/privacy.js",
      "../../assets/js/rewards.js",
      "../../assets/js/roundstore.js",
      "../../assets/js/showcase.js",
      "../../assets/js/storage.js",
      "../../assets/js/stub.js",
      "../../assets/js/trophycard.js",
      "../../assets/i18n/de.js",
      "../../assets/i18n/en.js",
      "./logic.js",
      "../lesen/logic.js",
      "../lesen/content.js",
      "./einmaleins.js",
      "./i18n.js",
      "./logic.js",
      "./picker.js"
    ];
    var imports = {};
    for (var i = 0; i < mods.length; i++) imports[mods[i]] = mods[i] + "?v=" + v;
    var s = document.createElement("script");
    s.type = "importmap";
    s.textContent = JSON.stringify({ imports: imports });
    document.currentScript.after(s);
  })();
  </script>
</head>
<body>
  <div class="game">
    <header class="topbar" id="topbar"></header>

    <!-- the path and the question are one group: "here is how far you are,
         here is what is next". The answers sit under the thumb. -->
    <div class="stage">
      <!-- The table and difficulty read as the round's title, so they sit above
           the scene and share its width instead of crowding the top bar. -->
      <button class="chip pickheading" id="pickchip"></button>
      <!-- one picture, no words: sky = stars still to win, basket = stars you
           own, path = the fox. See §10.5. -->
      <div class="journey-wrap" id="journey" role="img"></div>
      <div class="question" id="question"></div>
      <div class="feedback-aid" id="feedback" hidden></div>
    </div>

    <div class="answers" id="answers"></div>
  </div>

  <!-- Level picker (§3.3: overlay, never a separate page). One scrollable list
       of every level there is. Difficulty is not a switch: it is where a tile
       sits, what colour it has, and how many stars it still has to give. -->
  <div class="overlay" id="pick-overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <h2 data-i18n="emPickTitle">Reihe &amp; Schwierigkeit</h2>
      <div class="levels" id="pick-levels"></div>
    </div>
  </div>

  <!-- round summary (§10.1) -->
  <div class="overlay" id="sum-overlay" hidden>
    <!-- A child who just won reads almost nothing. Stars say how it went, the
         trophy is the prize, ONE button says what happens next. Mara read the
         three buttons that used to be here as a wall and tried to press the
         chip behind the sheet; the map and the level picker live in the top bar
         and the chip, which is where she looked for them anyway (§10.1).

         NOT aria-modal: those two are above this sheet and stay tappable, on
         purpose (§3.4). Claiming modality would tell a screen reader that the
         only way out of the summary does not exist. -->
    <div class="sheet summary" role="dialog" aria-modal="false">
      <div class="bigstars" id="sum-stars"></div>
      <p class="sline stat" id="sum-score"></p>
      <p class="sline goal" id="sum-goal" hidden></p>
      <p class="sline best" id="sum-best" hidden></p>
      <!-- the tempo ladder (§10.6): a symbol, never seconds -->
      <p class="sline tempo" id="sum-tempo" hidden></p>
      <div class="trophy-earn" id="sum-trophy" hidden></div>
      <button class="primary" id="sum-ok"></button>
    </div>
  </div>

  <script type="module" src="einmaleins.js?v=64"></script>
</body>
</html>
