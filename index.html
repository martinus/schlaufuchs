<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schlaufuchs</title>
  <meta name="description" content="Spielerisch lernen und ein Schlaufuchs werden">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/schlaufuchs.css">
</head>
<body>
  <header class="topbar">
    <div class="levelchip" id="levelchip"></div>
    <span class="chip streakchip" id="streakchip" hidden></span>
    <span class="spacer"></span>
    <a class="iconbtn" href="album.html" id="albumbtn" data-i18n-label="album">📖</a>
    <button class="iconbtn" id="soundbtn" data-i18n-label="sound">🔊</button>
    <button class="iconbtn" id="langbtn" data-i18n-label="language">EN</button>
  </header>

  <main>
    <div class="worldmap-wrap">
      <svg class="worldmap" viewBox="0 0 360 560" role="group" aria-label="Schlaufuchs">
        <!-- backdrop -->
        <rect x="0" y="0" width="360" height="200" fill="var(--sky)"/>
        <circle cx="50" cy="48" r="22" fill="#f4b400" opacity="0.9"/>
        <path d="M0 200 h360 v360 h-360 z" fill="var(--grass)"/>
        <path d="M0 200 q90 -34 180 0 t180 0 v14 h-360 z" fill="var(--grass)" opacity="0.7"/>
        <!-- decorative connecting paths -->
        <path d="M180 390 q-40 -80 -100 -160 M180 390 q60 -60 105 -125 M180 390 q60 -30 110 -95 M180 400 q-55 30 -105 65"
              stroke="#d9b48f" stroke-width="7" fill="none" stroke-linecap="round"
              stroke-dasharray="1 12" opacity="0.85"/>

        <!-- Rechenberg (Rechnungen) top right -->
        <a href="games/rechnungen/" class="region" id="region-rechnungen" data-game="rechnungen">
          <rect x="200" y="45" width="160" height="180" fill="transparent"/>
          <polygon points="235,185 300,55 360,185" fill="#9aa0a6"/>
          <polygon points="272,110 300,55 326,110 313,102 300,116 286,101" fill="#f5f2ec"/>
          <polygon points="205,185 250,105 292,185" fill="#7d858c"/>
          <g class="layer-thriving"><text x="255" y="150" font-size="16">🐐</text></g>
          <g class="layer-mastered">
            <text x="292" y="52" font-size="16">🚩</text>
            <text x="330" y="120" font-size="14">🦅</text>
          </g>
          <text class="region-label" x="290" y="205" data-i18n="region_rechnungen">Rechenberg</text>
          <text class="region-stars" x="290" y="220" data-stars="rechnungen">⭐ 0</text>
        </a>

        <!-- Wörterwald (Vokabeln) left -->
        <a href="games/vokabeln/" class="region" id="region-vokabeln" data-game="vokabeln">
          <rect x="15" y="95" width="145" height="147" fill="transparent"/>
          <g>
            <polygon points="30,175 55,105 80,175" fill="#3f7d3a"/>
            <polygon points="70,185 95,110 120,185" fill="#2f6e2b"/>
            <polygon points="105,170 125,115 145,170" fill="#3f7d3a"/>
            <rect x="52" y="175" width="7" height="14" fill="#6b4423"/>
            <rect x="92" y="185" width="7" height="14" fill="#6b4423"/>
            <rect x="122" y="170" width="6" height="12" fill="#6b4423"/>
          </g>
          <g class="layer-thriving"><text x="60" y="150" font-size="15">🦉</text></g>
          <g class="layer-mastered">
            <text x="105" y="160" font-size="15">🦌</text>
            <text x="35" y="120" font-size="13">✨</text>
          </g>
          <text class="region-label" x="88" y="222" data-i18n="region_vokabeln">Wörterwald</text>
          <text class="region-stars" x="88" y="237" data-stars="vokabeln">⭐ 0</text>
        </a>

        <!-- Tippsee (Tippen) right middle -->
        <a href="games/tippen/" class="region" id="region-tippen" data-game="tippen">
          <rect x="215" y="222" width="140" height="146" fill="transparent"/>
          <ellipse cx="285" cy="290" rx="65" ry="38" fill="#5aa7d6"/>
          <ellipse cx="285" cy="290" rx="65" ry="38" fill="none" stroke="#3d8ab8" stroke-width="3"/>
          <rect x="238" y="240" width="34" height="22" rx="2" fill="#b06f3c"/>
          <polygon points="234,241 255,226 276,241" fill="#8d5524"/>
          <g class="layer-thriving"><text x="290" y="288" font-size="15">⛵</text></g>
          <g class="layer-mastered"><text x="312" y="302" font-size="15">🦢</text></g>
          <text class="region-label" x="285" y="348" data-i18n="region_tippen">Tippsee</text>
          <text class="region-stars" x="285" y="363" data-stars="tippen">⭐ 0</text>
        </a>

        <!-- Zahlendorf (Einmaleins) center -->
        <a href="games/einmaleins/" class="region" id="region-einmaleins" data-game="einmaleins">
          <rect x="115" y="352" width="130" height="116" fill="transparent"/>
          <g>
            <rect x="130" y="395" width="38" height="32" fill="#f3d9b1"/>
            <polygon points="126,396 149,376 172,396" fill="#c1121f"/>
            <rect x="143" y="410" width="12" height="17" fill="#6b4423"/>
            <rect x="180" y="390" width="48" height="37" fill="#f5f2ec"/>
            <polygon points="176,391 204,366 232,391" fill="#b06f3c"/>
            <circle cx="204" cy="381" r="4.5" fill="#f4b400"/>
            <rect x="188" y="400" width="10" height="10" fill="#5aa7d6"/>
            <rect x="210" y="400" width="10" height="10" fill="#5aa7d6"/>
            <rect x="197" y="410" width="14" height="17" fill="#6b4423"/>
          </g>
          <g class="layer-thriving">
            <text x="125" y="375" font-size="13">✨</text>
            <text x="228" y="368" font-size="13">✨</text>
          </g>
          <g class="layer-mastered"><text x="172" y="360" font-size="15">🎪</text></g>
          <text class="region-label" x="180" y="448" data-i18n="region_einmaleins">Zahlendorf</text>
          <text class="region-stars" x="180" y="463" data-stars="einmaleins">⭐ 0</text>
        </a>

        <!-- Lesewiese (Lesen) bottom left -->
        <a href="games/lesen/" class="region" id="region-lesen" data-game="lesen">
          <rect x="10" y="452" width="135" height="108" fill="transparent"/>
          <ellipse cx="80" cy="495" rx="70" ry="34" fill="#a8d08d"/>
          <rect x="70" y="465" width="12" height="30" fill="#6b4423"/>
          <circle cx="76" cy="452" r="26" fill="#3f7d3a"/>
          <text x="76" y="460" font-size="16" text-anchor="middle">📖</text>
          <g class="layer-thriving">
            <text x="35" y="505" font-size="13">🌼</text>
            <text x="115" y="510" font-size="13">🌼</text>
          </g>
          <g class="layer-mastered"><text x="110" y="470" font-size="15">🌈</text></g>
          <text class="region-label" x="80" y="546" data-i18n="region_lesen">Lesewiese</text>
          <text class="region-stars" x="80" y="559" data-stars="lesen">⭐ 0</text>
        </a>

        <!-- the fox, placed by map.js at the last-played region -->
        <g id="map-fox"></g>
      </svg>
    </div>

    <nav class="fallback-nav" aria-label="Spiele">
      <a href="games/einmaleins/" data-i18n="game_einmaleins">Einmaleins</a>
      <a href="games/rechnungen/" data-i18n="game_rechnungen">Rechnungen</a>
      <a href="games/tippen/" data-i18n="game_tippen">Tippen</a>
      <a href="games/vokabeln/" data-i18n="game_vokabeln">Vokabeln</a>
      <a href="games/lesen/" data-i18n="game_lesen">Lesen</a>
      <a href="album.html" data-i18n="album">Stickeralbum</a>
    </nav>
  </main>

  <footer>
    <p data-i18n="footerPrivacy">Deine Fortschritte werden nur auf diesem Gerät gespeichert.</p>
    <button id="resetbtn" data-i18n="resetAll">Fortschritt löschen</button>
  </footer>

  <div class="overlay" id="reset-overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <h2 data-i18n="confirmResetAll">Wirklich den ganzen Fortschritt löschen?</h2>
      <div class="seg" style="grid-template-columns: 1fr 1fr;">
        <button id="reset-cancel" data-i18n="cancel">Abbrechen</button>
        <button id="reset-confirm" data-i18n="confirmDelete">Ja, löschen</button>
      </div>
    </div>
  </div>

  <script type="module" src="assets/js/map.js"></script>
</body>
</html>
