<body class="mappage">
  <!-- Every page a child can reach carries the same bar, built by one
       function: map button, fox status, gear. Nothing else earns a place up
       here (§3.3). On the map its map button is flat — you are already here. -->
  <header class="topbar" id="topbar"></header>

  <main>
    <div class="worldmap-wrap">
      <svg class="worldmap" viewBox="0 0 360 560" role="group" aria-label="Schlaufuchs">
        <!-- the world is an island: sea, beach, land (§3.1) -->
        <defs>
          <path id="coast" d="M64 14 C140 6 240 8 302 18 C336 24 350 46 348 84
            C346 130 352 170 348 210 C344 262 352 320 348 372
            C344 424 352 480 336 516 C322 546 280 552 236 548
            C180 542 120 552 76 544 C34 536 8 512 12 470
            C16 410 6 350 12 292 C18 230 6 150 14 92 C18 52 30 20 64 14 Z"/>
          <!-- fog over the regions whose game is not built yet (map.js) -->
          <filter id="fog-blur" x="-30%" y="-50%" width="160%" height="200%">
            <feGaussianBlur stdDeviation="3.2"/>
          </filter>
        </defs>
        <rect x="0" y="0" width="360" height="560" fill="var(--sea)"/>
        <!-- gentle waves in the sea -->
        <g stroke="#9fd0ea" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9">
          <path d="M4 240 q6 -5 12 0"/>
          <path d="M354 300 q-6 -5 -12 0"/>
          <path d="M120 556 q6 -5 12 0"/>
          <path d="M170 8 q6 -5 12 0"/>
        </g>
        <use href="#coast" fill="none" stroke="#f0dcac" stroke-width="13"/>
        <use href="#coast" fill="var(--grass)"/>
        <!-- soft hills for texture -->
        <g fill="#a6cd8f" opacity="0.3">
          <ellipse cx="110" cy="300" rx="70" ry="26"/>
          <ellipse cx="316" cy="384" rx="42" ry="18"/>
          <ellipse cx="52" cy="370" rx="40" ry="17"/>
        </g>
        <!-- A bush and a few daisies where the roads cross open grass: the
             island's heart was bare, and bare green reads as unfinished page,
             not as meadow. Decorative only — no handler, no hit shape. -->
        <g class="meadow-deco">
          <ellipse cx="163" cy="303" rx="15" ry="7" fill="#8fbf7f"/>
          <ellipse cx="175" cy="299" rx="10" ry="6" fill="#a6cd8f"/>
          <circle cx="150" cy="320" r="3.5" fill="#fff"/>
          <circle cx="150" cy="320" r="1.4" fill="#f4b400"/>
          <circle cx="196" cy="290" r="3.5" fill="#fff"/>
          <circle cx="196" cy="290" r="1.4" fill="#f4b400"/>
          <circle cx="207" cy="322" r="3.5" fill="#fff"/>
          <circle cx="207" cy="322" r="1.4" fill="#f4b400"/>
        </g>
        <!-- compass rose -->
        <g transform="translate(44,48)">
          <circle r="19" fill="#fdf6e6" stroke="#c9a978" stroke-width="2"/>
          <polygon points="0,-15 4,0 0,15 -4,0" fill="#e07a3f"/>
          <polygon points="-15,0 0,-4 15,0 0,4" fill="#8d5524"/>
          <text x="0" y="-20" font-size="9" font-weight="800" text-anchor="middle" fill="#8d5524">N</text>
        </g>
        <!-- Roads from the village. A mastered region's road paves itself
             (class `paved`, set by map.js) — the map records the child. -->
        <g class="roads" fill="none" stroke-linecap="round">
          <path class="road" id="road-vokabeln" d="M170 388 q-38 -80 -82 -196"/>
          <path class="road" id="road-rechnungen" d="M170 388 q76 -76 112 -198"/>
          <path class="road" id="road-tippen" d="M170 388 q62 -36 100 -68"/>
          <path class="road" id="road-lesen" d="M138 414 q-16 12 -34 36"/>
          <path class="road" id="road-pokalraum" d="M204 418 q26 22 34 44"/>
        </g>
        <!-- the dashed centre line of a dirt track; hidden once it is paved -->
        <g class="roadlines" fill="none" stroke-linecap="round">
          <use class="roadline" id="roadline-vokabeln" href="#road-vokabeln"/>
          <use class="roadline" id="roadline-rechnungen" href="#road-rechnungen"/>
          <use class="roadline" id="roadline-tippen" href="#road-tippen"/>
          <use class="roadline" id="roadline-lesen" href="#road-lesen"/>
          <use class="roadline" id="roadline-pokalraum" href="#road-pokalraum"/>
        </g>

        <!-- Wörterwald (Vokabeln) left -->
        <a href="games/vokabeln/" class="region" id="region-vokabeln" data-game="vokabeln">
          <rect class="hit" fill="transparent" x="14" y="102" width="144" height="142"/>
          <g>
            <ellipse cx="86" cy="190" rx="70" ry="13" fill="#96c47f"/>
            <polygon points="30,175 55,105 80,175" fill="#3f7d3a"/>
            <polygon points="70,185 95,110 120,185" fill="#2f6e2b"/>
            <polygon points="105,170 125,115 145,170" fill="#3f7d3a"/>
            <rect x="52" y="175" width="7" height="14" fill="#6b4423"/>
            <rect x="92" y="185" width="7" height="14" fill="#6b4423"/>
            <rect x="122" y="170" width="6" height="12" fill="#6b4423"/>
          </g>
          <g class="layer-thriving"><text data-icon="deco-owl" data-icon-size="15" x="60" y="150" font-size="15">🦉</text></g>
          <g class="layer-mastered">
            <text data-icon="deco-deer" data-icon-size="15" x="105" y="160" font-size="15">🦌</text>
            <text data-icon="deco-sparkle" data-icon-size="13" x="35" y="120" font-size="13">✨</text>
          </g>
          <text class="region-label" x="88" y="222" data-i18n="region_vokabeln">Wörterwald</text>
          <g class="region-badge" data-badge="vokabeln" transform="translate(88,237)"></g>
        </a>

        <!-- Tippsee (Tippen) right middle -->
        <a href="games/tippen/" class="region" id="region-tippen" data-game="tippen">
          <rect class="hit" fill="transparent" x="218" y="226" width="126" height="146"/>
          <!-- hut first, lake on top: the shore reads as being in front (§3.1) -->
          <ellipse cx="248" cy="264" rx="26" ry="9" fill="#96c47f"/>
          <rect x="238" y="242" width="30" height="20" rx="2" fill="#b06f3c"/>
          <polygon points="234,243 253,229 272,243" fill="#8d5524"/>
          <ellipse cx="282" cy="294" rx="60" ry="36" fill="#f0dcac"/>
          <ellipse cx="282" cy="294" rx="55" ry="31" fill="#5aa7d6"/>
          <ellipse cx="282" cy="294" rx="55" ry="31" fill="none" stroke="#3d8ab8" stroke-width="2"/>

          <g class="layer-mastered"><text data-icon="deco-swan" data-icon-size="15" x="306" y="304" font-size="15">🦢</text></g>
          <text class="region-label" x="282" y="346" data-i18n="region_tippen">Tippsee</text>
          <g class="region-badge" data-badge="tippen" transform="translate(282,361)"></g>
        </a>

        <!-- Rechenberg (Rechnungen) top right. Painted after the fogged regions
             (Wörterwald, Tippsee) so their fog banks never wash out its label —
             SVG paints in document order (tests/map.test.js, §3.1). -->
        <a href="games/rechnungen/" class="region" id="region-rechnungen" data-game="rechnungen">
          <rect class="hit" fill="transparent" x="202" y="40" width="148" height="184"/>
          <!-- foothills seat the peaks on the ground — nothing floats (§3.1) -->
          <ellipse cx="276" cy="188" rx="66" ry="14" fill="#96c47f"/>
          <polygon points="232,188 294,60 348,188" fill="#9aa0a6"/>
          <polygon points="268,112 294,60 320,112 307,104 294,118 281,103" fill="#f5f2ec"/>
          <polygon points="204,188 246,108 288,188" fill="#7d858c"/>
          <g class="layer-thriving"><text data-icon="deco-goat" data-icon-size="16" x="255" y="150" font-size="16">🐐</text></g>
          <g class="layer-mastered">
            <text data-icon="deco-flag" data-icon-size="16" x="286" y="58" font-size="16">🚩</text>
            <text data-icon="deco-eagle" data-icon-size="14" x="322" y="122" font-size="14">🦅</text>
          </g>
          <text class="region-label" x="282" y="208" data-i18n="region_rechnungen">Rechenberg</text>
          <g class="region-badge" data-badge="rechnungen" transform="translate(282,222)"></g>
        </a>

        <!-- Lesewiese (Lesen) bottom left. It sits a step down and away from
             the village: its tree once leaned on the left house, and their hit
             rects shared a 40px strip where SVG paint order decided the tap. -->
        <a href="games/lesen/" class="region" id="region-lesen" data-game="lesen">
          <rect class="hit" fill="transparent" x="14" y="412" width="96" height="130"/>
          <ellipse cx="78" cy="484" rx="62" ry="30" fill="#a8d08d"/>
          <rect x="68" y="454" width="12" height="30" fill="#6b4423"/>
          <circle cx="74" cy="441" r="26" fill="#3f7d3a"/>
          <text data-icon="deco-book" data-icon-size="16" x="74" y="449" font-size="16" text-anchor="middle">📖</text>
          <g class="layer-thriving">
            <text data-icon="deco-flower" data-icon-size="13" x="36" y="494" font-size="13">🌼</text>
            <text data-icon="deco-flower" data-icon-size="13" x="110" y="498" font-size="13">🌼</text>
          </g>
          <g class="layer-mastered"><text data-icon="deco-rainbow" data-icon-size="15" x="106" y="458" font-size="15">🌈</text></g>
          <text class="region-label" x="78" y="528" data-i18n="region_lesen">Lesewiese</text>
          <g class="region-badge" data-badge="lesen" transform="translate(78,542)"></g>
        </a>

        <!-- Einmaleins, the village at the crossroads. The place is named after
             its game: one name to learn, not two (§3.1). -->
        <a href="games/einmaleins/" class="region" id="region-einmaleins" data-game="einmaleins">
          <!-- Mara tapped the gap between the two houses and nothing happened.
               The width stops short of the lake's rect at x=218. -->
          <rect class="hit" fill="transparent" x="112" y="350" width="104" height="120"/>
          <g>
            <ellipse cx="170" cy="428" rx="62" ry="11" fill="#96c47f"/>
            <rect x="120" y="395" width="38" height="32" fill="#f3d9b1"/>
            <polygon points="116,396 139,376 162,396" fill="#c1121f"/>
            <rect x="133" y="410" width="12" height="17" fill="#6b4423"/>
            <rect x="170" y="390" width="48" height="37" fill="#f5f2ec"/>
            <polygon points="166,391 194,366 222,391" fill="#b06f3c"/>
            <circle cx="194" cy="381" r="4.5" fill="#f4b400"/>
            <rect x="178" y="400" width="10" height="10" fill="#5aa7d6"/>
            <rect x="200" y="400" width="10" height="10" fill="#5aa7d6"/>
            <rect x="187" y="410" width="14" height="17" fill="#6b4423"/>
            <!-- the village is the crossroads, so it has no road of its own:
                 mastering it cobbles its square instead (§3.1) -->
            <ellipse class="plaza" id="plaza-einmaleins" cx="170" cy="433" rx="46" ry="8"/>
          </g>
          <g class="layer-thriving">
            <text data-icon="deco-sparkle" data-icon-size="13" x="115" y="375" font-size="13">✨</text>
            <text data-icon="deco-sparkle" data-icon-size="13" x="218" y="368" font-size="13">✨</text>
          </g>
          <g class="layer-mastered"><text data-icon="deco-circus" data-icon-size="15" x="162" y="360" font-size="15">🎪</text></g>
          <text class="region-label" x="170" y="448" data-i18n="region_einmaleins">Einmaleins</text>
          <g class="region-badge" data-badge="einmaleins" transform="translate(170,463)"></g>
        </a>

        <!-- Pokalraum (Trophy Room) bottom right -> trophy album -->
        <a href="album.html" class="region" id="region-pokalraum" data-game="pokalraum">
          <rect class="hit" fill="transparent" x="246" y="406" width="96" height="136"/>
          <ellipse cx="278" cy="498" rx="60" ry="12" fill="#96c47f"/>
          <rect x="233" y="494" width="90" height="8" fill="#c9b79c"/>
          <rect x="241" y="442" width="74" height="52" fill="#f5f2ec"/>
          <!-- two columns, not four: the 11px gaps between four of them left no
               room to seat a trophy big enough to recognise from arm's length -->
          <rect x="247" y="444" width="7" height="46" fill="#d9cbb8"/>
          <rect x="301" y="444" width="7" height="46" fill="#d9cbb8"/>
          <polygon points="234,442 278,412 322,442" fill="#b06f3c"/>
          <!-- The room says what it holds: a trophy on its own facade, with the
               size of the collection written above it. That number used to be a
               badge under the house, one more label among the region labels —
               here it can only mean the cup it sits on (map.js fills it). -->
          <text class="pokal-count" id="pokal-count" x="278" y="460" aria-hidden="true">0</text>
          <text data-icon="deco-trophy" data-icon-size="26" x="278" y="488" font-size="26" text-anchor="middle">🏆</text>
          <g class="layer-thriving"><text data-icon="deco-sparkle" data-icon-size="13" x="246" y="432" font-size="13">✨</text></g>
          <g class="layer-mastered"><text data-icon="deco-party" data-icon-size="15" x="311" y="432" font-size="15">🎉</text></g>
          <text class="region-label" x="278" y="518" data-i18n="region_pokalraum">Pokalraum</text>
        </a>

        <!-- the fox, placed by map.js at the last-played region -->
        <g id="map-fox"></g>
      </svg>
    </div>
