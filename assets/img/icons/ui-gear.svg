<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- an eight-tooth cog with a friendly round hub; the hub hole is a third of
       the width so the shape still says "gear" at 22px, not "asterisk" -->
  <g fill="#4a2c17">
    <rect x="27" y="4" width="10" height="56" rx="4.5"/>
    <rect x="27" y="4" width="10" height="56" rx="4.5" transform="rotate(45 32 32)"/>
    <rect x="27" y="4" width="10" height="56" rx="4.5" transform="rotate(90 32 32)"/>
    <rect x="27" y="4" width="10" height="56" rx="4.5" transform="rotate(135 32 32)"/>
    <circle cx="32" cy="32" r="18"/>
  </g>
  <circle cx="32" cy="32" r="10.5" fill="#fdf6ec"/>
</svg>
