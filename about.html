      "./games/einmaleins/logic.js",
      "./games/lesen/logic.js",
      "./games/lesen/content.js"
    ];
    var imports = {};
    for (var i = 0; i < mods.length; i++) imports[mods[i]] = mods[i] + "?v=" + v;
    var s = document.createElement("script");
    s.type = "importmap";
    s.textContent = JSON.stringify({ imports: imports });
    document.currentScript.after(s);
  })();
  </script>
